<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" rx="20" fill="#0f172a"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="0.3">
    jjdr 팀 자동 PR 리뷰 전체 흐름 (한눈에 보기)
  </text>

  <!-- 3 Actor Columns -->
  <!-- Column 1: Author -->
  <rect x="40" y="54" width="230" height="58" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="155" y="79" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="800">작성자 jjdr</text>
  <text x="155" y="99" text-anchor="middle" fill="#94a3b8" font-size="11.5">PR 생성 · 리뷰어 2명 선택</text>
  <line x1="155" y1="112" x2="155" y2="425" stroke="#334155" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Column 2: Relay -->
  <rect x="365" y="54" width="230" height="58" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="480" y="79" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="800">jjdr-relay.exe</text>
  <text x="480" y="99" text-anchor="middle" fill="#94a3b8" font-size="11.5">사내 공용 PC (실시간 중계 허브)</text>
  <line x1="480" y1="112" x2="480" y2="425" stroke="#334155" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Column 3: Reviewer -->
  <rect x="690" y="54" width="230" height="58" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="805" y="79" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="800">리뷰어 jjdr (x2)</text>
  <text x="805" y="99" text-anchor="middle" fill="#94a3b8" font-size="11.5">자동 AI 리뷰 · Zen 결재</text>
  <line x1="805" y1="112" x2="805" y2="425" stroke="#334155" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: Author creates PR -->
  <rect x="52" y="130" width="206" height="44" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="72" cy="152" r="10" fill="#3b82f6"/>
  <text x="72" y="156" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">1</text>
  <text x="90" y="149" fill="#e2e8f0" font-size="12" font-weight="700">gh pr create 감지</text>
  <text x="90" y="165" fill="#93c5fd" font-size="10.5">리뷰어 2명 선택 (gh pr edit)</text>

  <!-- Step 2: Author -> Relay -->
  <line x1="165" y1="198" x2="468" y2="198" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <circle cx="290" cy="186" r="10" fill="#3b82f6"/>
  <text x="290" y="190" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">2</text>
  <text x="307" y="190" fill="#bfdbfe" font-size="12" font-weight="700">리뷰 요청 발송</text>

  <!-- Step 3: Relay -> Reviewer -->
  <line x1="490" y1="228" x2="793" y2="228" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <circle cx="595" cy="216" r="10" fill="#f59e0b"/>
  <text x="595" y="220" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">3</text>
  <text x="612" y="220" fill="#fde68a" font-size="12" font-weight="700">온라인 리뷰어에게 즉시 푸시</text>

  <!-- Step 4: Reviewer runs ephemeral AI review -->
  <rect x="698" y="246" width="214" height="58" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="718" cy="268" r="10" fill="#10b981"/>
  <text x="718" y="272" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">4</text>
  <text x="736" y="266" fill="#ecfdf5" font-size="12" font-weight="700">임시 Worktree + AI 리뷰</text>
  <text x="736" y="282" fill="#a7f3d0" font-size="10.5">PR 코멘트 + .jjdr-review 저장</text>
  <text x="736" y="296" fill="#6ee7b7" font-size="10">(Zen Working → Zen Inbox)</text>

  <!-- Step 5: Reviewer -> Relay -> Author status -->
  <line x1="795" y1="330" x2="492" y2="330" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <line x1="468" y1="330" x2="167" y2="330" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <circle cx="575" cy="318" r="10" fill="#10b981"/>
  <text x="575" y="322" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">5</text>
  <text x="592" y="322" fill="#a7f3d0" font-size="11.5" font-weight="700">진행 상태 실시간 중계</text>

  <rect x="52" y="344" width="206" height="44" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="155" y="363" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="700">작성자 미니 상태바 갱신</text>
  <text x="155" y="379" text-anchor="middle" fill="#6ee7b7" font-size="10.5">@A Reviewing | @B Posted</text>

  <!-- Step 6: Reviewer Ack -> Auto Delete -->
  <rect x="698" y="352" width="214" height="50" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="718" cy="377" r="10" fill="#10b981"/>
  <text x="718" y="381" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">6</text>
  <text x="736" y="373" fill="#ecfdf5" font-size="12" font-weight="700">[Review MD] 열람 &amp; 결재</text>
  <text x="736" y="390" fill="#a7f3d0" font-size="10.5">도장 찍으면 임시 Worktree 자동 삭제</text>

  <!-- Footer Note -->
  <text x="480" y="444" text-anchor="middle" fill="#64748b" font-size="11">
    ※ 온라인 팀원만 선택 가능 · 오프라인 시 요청 차단 · GitHub 폴링 0% · 공용 PC 토큰/AI키 0%
  </text>
</svg>
