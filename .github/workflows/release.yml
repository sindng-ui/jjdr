name: Release jjdr Desktop

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional highlight notes to prepend to What's New"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compare_version.outputs.should_release }}
      version: ${{ steps.pkg_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Current package.json Version
        id: pkg_version
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "version=${CURRENT_VER}" >> "$GITHUB_OUTPUT"
          echo "Current version in package.json: ${CURRENT_VER}"

      - name: Compare with Previous Commit Version
        id: compare_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch triggered. Triggering release!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_VER=$(git show HEAD~1:package.json 2>/dev/null | node -e "
            const fs = require('fs');
            try {
              const data = fs.readFileSync(0, 'utf8');
              console.log(JSON.parse(data).version || '');
            } catch {
              console.log('');
            }
          ")
          echo "Previous version: ${PREV_VER}"

          CURRENT_VER="${{ steps.pkg_version.outputs.version }}"
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/v${CURRENT_VER}" || true)
          if [ -n "$CURRENT_VER" ] && { [ "$CURRENT_VER" != "$PREV_VER" ] || [ -z "$EXISTING_TAG" ]; }; then
            echo "Triggering release for v${CURRENT_VER} (prev='$PREV_VER', tag_exists=$([ -n "$EXISTING_TAG" ] && echo yes || echo no))"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version v${CURRENT_VER} is already released ($CURRENT_VER == $PREV_VER). Skipping build/release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync tauri.conf.json Version with package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const tauriPath = './src-tauri/tauri.conf.json';
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
            tauriConf.version = pkg.version;
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + '\n');
            console.log('Updated tauri.conf.json version to:', pkg.version);
          "

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

      - name: Generate Release Notes (What's New)
        id: release_notes
        shell: bash
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          node scripts/generate-release-notes.mjs \
            --version="${{ needs.check-version.outputs.version }}" \
            --repo="${{ github.repository }}" \
            --github-output="body"

      - name: Build Tauri Desktop (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: 'jjdr v${{ needs.check-version.outputs.version }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Generate & Upload Rate-Limit-Free latest.json Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_BODY: ${{ steps.release_notes.outputs.body }}
        run: |
          node scripts/generate-latest-manifest.mjs \
            --version="${{ needs.check-version.outputs.version }}" \
            --repo="${{ github.repository }}" \
            --bundle-dir="src-tauri/target/release/bundle" \
            --out="latest.json"
          gh release upload "v${{ needs.check-version.outputs.version }}" latest.json --clobber
