<!doctype html>
<html lang="en" data-theme="aurora" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jjdr — Mission Control</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("jjdr-theme") || "aurora";
          if (t !== "aurora" && t !== "lounge" && t !== "nordic" && t !== "botanical") {
            t = "aurora";
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.toggle("dark", t !== "nordic");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
